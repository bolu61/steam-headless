# Part 1/2 of the Remote Play reconnect-deadlock workaround; see
# docs/remote-play-reconnect-deadlock.md. Companion:
# config/wireplumber/wireplumber.conf.d/99-no-default-node-persistence.conf

pulse.cmd = [
    { cmd = "load-module" args = "module-null-sink sink_name=headless_fallback_sink sink_properties=node.description=HeadlessFallbackSink" }
    { cmd = "load-module" args = "module-virtual-source source_name=headless_fallback_source" }
]
